name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e apps/api
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install compatible Remotion headless shell
        run: |
          node --input-type=module <<'JS'
          import {ensureBrowser} from '@remotion/renderer';
          import {appendFileSync} from 'node:fs';
          const browser = await ensureBrowser();
          if (!('path' in browser)) throw Error('Remotion browser unavailable');
          appendFileSync(process.env.GITHUB_ENV, 'CHROME_EXECUTABLE=' + browser.path + '\n');
          JS
      - run: .venv/bin/python scripts/check.py
      - run: npm run format:check
      - run: npm run test:ui
      - name: Fixed authored visual fixture (no model inference)
        run: .venv/bin/python scripts/verify_visual_v4.py
      - name: Fixed parameter/code/theme fixture (no model inference)
        run: .venv/bin/python scripts/verify_reference_mechanisms.py
      - name: MCP SDK and authenticated API smoke
        run: |
          python -m venv .mcp-venv
          .mcp-venv/bin/python -m pip install -e 'apps/api[mcp]'
          .mcp-venv/bin/python scripts/verify_mcp.py --api-python .venv/bin/python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          include-hidden-files: true
          path: |
            .verify-visual-v4/verification.json
            .verify-visual-v4/*/result.json
            .verify-visual-v4/final/video.mp4
            .verify-visual-v4/preview/motion-*.mp4
            .verify-reference-mechanisms/verification.json
            .verify-reference-mechanisms/final/video.mp4
            .verify-reference-mechanisms/preview/motion-*.mp4
            .verify-mcp-v4/verification.json
            test-results/
