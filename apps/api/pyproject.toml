[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "explainer-studio"
version = "3.0.0"
description = "Source and prompt to editable narrated explainer video"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "python-multipart==0.0.20",
  "httpx==0.28.1", "pydantic-settings==2.9.1", "temporalio==1.11.1",
  "psycopg[binary]==3.2.9", "boto3==1.38.23", "fonttools==4.60.1", "pillow==11.3.0"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.8", "moto[s3]==5.1.5"]
integration = ["moto[server]==5.1.5"]
mcp = ["mcp==1.26.0"]
edge = ["edge-tts==7.2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

